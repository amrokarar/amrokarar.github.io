<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <rect width="320" height="200" fill="#f5f5f5"/>

  <!-- Browser frame -->
  <rect x="40" y="28" width="240" height="144" rx="8" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <line x1="40" y1="52" x2="280" y2="52" stroke="#111" stroke-width="3"/>
  <circle cx="56" cy="40" r="3.5" fill="#111"/>
  <circle cx="68" cy="40" r="3.5" fill="#111"/>
  <circle cx="80" cy="40" r="3.5" fill="#111"/>

  <!-- Sidebar -->
  <rect x="54" y="66" width="44" height="92" rx="3" fill="#e4e4e4"/>
  <rect x="60" y="74" width="32" height="6" rx="3" fill="#bdbdbd"/>
  <rect x="60" y="88" width="32" height="6" rx="3" fill="#bdbdbd"/>
  <rect x="60" y="102" width="24" height="6" rx="3" fill="#bdbdbd"/>

  <!-- Ghost: where the block used to be -->
  <rect x="112" y="112" width="152" height="46" rx="3" fill="none" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- Block in its new, promoted position -->
  <rect x="112" y="66" width="152" height="46" rx="3" fill="#111"/>
  <rect x="124" y="78" width="60" height="7" rx="3.5" fill="#fff"/>
  <rect x="124" y="92" width="100" height="6" rx="3" fill="#8a8a8a"/>

  <!-- Arrow showing the move -->
  <path d="M190 148 C190 136 190 128 190 122" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M182 130 L190 120 L198 130" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
